<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrian - dr. Galih PRO</title>
<style>
body{font-family:system-ui; background:#f0f9ff; padding:20px; text-align:center}
.card{background:white; padding:20px; margin:12px auto; border-radius:16px; max-width:600px; box-shadow:0 4px 12px rgba(0,0,0,.1)}
.big{font-size:48px; font-weight:bold; color:#0369a1}
.btn{padding:14px 24px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin:5px}
.panggil{background:#0ea5e9; color:white; font-size:18px}
.rm{background:#10b981; color:white}
</style></head><body>
<h1>🩺 Antrian - dr. Galih</h1>
<a href="/">Daftar</a> | <a href="/riwayat.html">Riwayat</a> | <button onclick="load()">🔄 Refresh</button>
<div id="list">Loading...</div>
<audio id="player" controls style="margin-top:20px; width:100%; max-width:400px"></audio>
<script>
let data=[]
async function load(){
  const res = await fetch('/api/antrian')
  data = await res.json()
  document.getElementById('list').innerHTML = data.map((p,i)=>`
    <div class="card">
      <div class="big">#${p.no_antrian}</div>
      <b style="font-size:20px">${p.nama}</b><br><span>${p.no_rm}</span><br><br>
      <button class="btn panggil" onclick="panggil(${i})">📢 PANGGIL - Suara Indo</button>
      <a class="btn rm" href="/rm.html?no_rm=${p.no_rm}" style="text-decoration:none">📝 RM</a>
    </div>
  `).join('') || '<p>Belum ada antrian</p>'
}
async function panggil(i){
  const p = data[i]
  const teks = `Nomor antrian ${p.no_antrian}, ${p.nama}, silakan masuk ke ruang periksa dokter Galih`
  const player = document.getElementById('player')
  player.src = `/api/tts?text=${encodeURIComponent(teks)}`
  await player.play()
  document.body.style.background = '#fef3c7'
  setTimeout(()=>document.body.style.background='#f0f9ff', 1000)
}
load()
</script></body></html>
