<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antrian - Praktek dr Galih</title>
<script>if(!localStorage.getItem('token')&&!localStorage.getItem('user')&&!localStorage.getItem('login_user')){location.href='/login.html'}</script>
<style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between}.marquee-bar{width:100%;background:#f0f9ff;overflow:hidden;white-space:nowrap;padding:9px 0;border-bottom:1px solid #dbeafe}.marquee-bar span{display:inline-block;padding-left:100%;animation:marquee 20s linear infinite;color:#1d4ed8;font-size:13px;font-weight:700}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;justify-content:center}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}.antri-item{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}.antri-no{font-size:32px;font-weight:800;color:#1e40af}.btn{padding:10px 14px;border-radius:20px;border:none;cursor:pointer;font-weight:600}.btn-p{background:#ec4899;color:#fff}.copy{margin:16px;text-align:center;font-size:11px;color:#94a3b8}</style>
</head><body>
<div class="header"><div>🏥 Praktek dr Galih</div><div><span id="jam"></span> | <a href="#" onclick="localStorage.clear();location.href='/login.html'" style="color:#fff">Logout</a></div></div>
<div class="marquee-bar"><span>🏥 Praktek Mandiri dr.Galih | 📍 Jl.Raya Sengkol Aikdarek | 😊 Melayani dengan senyum | 🕕 Buka setiap hari kerja jam 06.00-11.00 dan 17.00-21.00 WITA |</span></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a class="active">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a><a href="/obat.html">💊 Obat</a></div>
<div class="card"><h3>🔢 Antrian</h3><div id="info">Loading...</div><div id="list" style="margin-top:16px"></div></div>
<div class="copy">Copyright - Vercel.Postgres + AI @2026</div>
<script>
let jamEl=document.getElementById('jam'); setInterval(()=>{if(jamEl) jamEl.innerText=new Date().toLocaleTimeString('id-ID')},1000);
let voices=[]; function loadV(){voices=speechSynthesis.getVoices()} speechSynthesis.onvoiceschanged=loadV; loadV();
let sedang=false;
function panggil(nama,no){if(sedang){speechSynthesis.cancel(); sedang=false; return;} sedang=true; if(!nama) nama='pasien'; let bersih=nama.replace(/[^a-zA-Z0-9 ]/g,' ').trim().substring(0,25); let teks=`Nomor antrian ${no}, atas nama ${bersih}, silakan masuk ke ruang dokter.`; speechSynthesis.cancel(); setTimeout(()=>{let u=new SpeechSynthesisUtterance(teks); u.lang='id-ID'; u.rate=0.85; let best=voices.find(v=>v.lang.toLowerCase().includes('id-ID'))||voices[0]; if(best) u.voice=best; u.onend=()=>{sedang=false;}; speechSynthesis.speak(u);},100);}
async function load(){try{const r=await fetch('/api/antrian');const d=await r.json();document.getElementById('info').innerText=d.length+' pasien antri';document.getElementById('list').innerHTML=d.map(k=>{let nm=(k.nama||(k.pasien&&k.pasien.nama)||'pasien').replace(/'/g,'');return `<div class="antri-item"><div style="display:flex;gap:12px;align-items:center"><div class="antri-no">#${k.no_antrian}</div><div><b>${nm}</b></div></div><button class="btn btn-p" onclick="panggil('${nm}','${k.no_antrian}')">🔊 PANGGIL</button></div>`}).join('')||'<p>Tidak ada antrian</p>'}catch(e){document.getElementById('info').innerText='Error: '+e}}load()
</script></body></html>
