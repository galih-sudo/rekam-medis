<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praktek Mandiri dr. Galih | Antrian</title><style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;flex-wrap:wrap}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 10px #0001}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}.antri-item{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}.antri-no{font-size:36px;font-weight:800;color:#1e40af}.btn{padding:8px 14px;border-radius:20px;border:none;cursor:pointer;font-size:12px}.btn-panggil{background:#ec4899;color:#fff}.btn-rm{background:#e2e8f0;color:#334155}select{padding:8px;border-radius:10px;border:1px solid #e2e8f0}</style></head><body>
<div class="header"><div>🏥 Praktek Mandiri dr. Galih | Rekam Medis</div><div><span id="jam"></span> | 30/10/2026 | dr_galih Dokter | <a href="/login.html" style="color:white">Logout</a></div></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a class="active" href="/antrian.html">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a><a href="/tambah.html">➕ Tambah</a><a href="/cari.html">🔍 Cari</a><a href="/obat.html">💊 Obat</a><a href="/icd10.html">📚 ICD-10</a><a href="/user.html">👥 User</a><a href="#">📊 Laporan ▼</a></div>
<div class="card"><h3 style="margin:0">🔢 Antrian Hari Ini - Praktek Mandiri</h3><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><select id="voiceSelect"><option>Loading suara lembut...</option></select><button onclick="testSuara()" style="padding:8px 12px;border-radius:20px;border:none;background:#f3e8ff">🎧 Test Suara Mantan</button></div><div style="color:#64748b;margin-top:6px" id="info">Loading...</div><div id="list" style="margin-top:16px"></div></div>
<script>
let voices=[]
function loadVoices(){voices=speechSynthesis.getVoices(); const indo=voices.filter(v=>v.lang.includes('id')||v.lang.includes('ID')); const female=voices.filter(v=>v.name.toLowerCase().includes('female')||v.name.toLowerCase().includes('google indonesia')||v.name.toLowerCase().includes('damayanti')||v.name.toLowerCase().includes('gadis')||v.name.includes('id-ID')); let list=female.length?female:(indo.length?indo:voices); voiceSelect.innerHTML=list.map((v,i)=>`<option value="${voices.indexOf(v)}">${v.name} - ${v.lang} ${v.name.toLowerCase().includes('female')||v.name.toLowerCase().includes('damayanti')?'💖':''}</option>`).join(''); if(!voiceSelect.value&&list[0])voiceSelect.value=voices.indexOf(list[0])}
speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,500)
setInterval(()=>{let d=new Date();let el=document.getElementById('jam');if(el)el.innerText=d.toLocaleTimeString('id-ID')},1000)
function speak(text){speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(text); let idx=parseInt(voiceSelect.value); if(voices[idx]){u.voice=voices[idx]; u.lang=voices[idx].lang} else {u.lang='id-ID'} u.rate=0.9; u.pitch=1.2; u.volume=1; speechSynthesis.speak(u)}
function panggil(nama,no){speak(`Nomor antrian ${no}, atas nama ${nama}, silakan masuk ke ruang dokter. Terima kasih sayang.`)}
function testSuara(){speak('Halo sayang, nomor antrian satu, Afwan Hafizi, silakan masuk ke ruang dokter. Aku tunggu ya.')}
async function load(){const r=await fetch('/api/antrian');const d=await r.json();document.getElementById('info').innerText=d.length+' pasien antri hari ini';document.getElementById('list').innerHTML=d.map(k=>`<div class="antri-item"><div style="display:flex;gap:16px;align-items:center"><div class="antri-no">#${k.no_antrian}</div><div><b>${k.nama||k.pasien?.nama}</b><br><small style="color:#64748b">${k.pasien?.no_rm||''} - ${k.keluhan||''}</small></div></div><div><button class="btn btn-panggil" onclick="panggil('${k.nama||k.pasien?.nama}','${k.no_antrian}')">💖 PANGGIL - Suara Lembut</button> <a class="btn btn-rm" href="/rekam.html?id=${k.pasienId}" style="text-decoration:none">RM</a></div></div>`).join('')||'<p style=text-align:center;color:#64748b>Tidak ada antrian</p>'}load();setInterval(load,10000)
</script></body></html>
