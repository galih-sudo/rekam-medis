<script>if(!localStorage.getItem("token")&&!localStorage.getItem("user")&&!localStorage.getItem("login_user")){location.href="/login.html"}</script>
<div class="header"><div>🏥 Praktek dr Galih</div><div><span id="jam"></span> | <a href="/login.html" style="color:#fff">Logout</a></div></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a class="active">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a></div>
<div class="card"><h3>🔢 Antrian</h3><div id="info">Loading...</div><div id="list" style="margin-top:16px"></div></div>
<script>
let jamEl=document.getElementById('jam'); setInterval(()=>{if(jamEl) jamEl.innerText=new Date().toLocaleTimeString('id-ID')},1000);
let voices=[]; function loadV(){voices=speechSynthesis.getVoices()} speechSynthesis.onvoiceschanged=loadV; loadV();
let sedang=false;
function panggil(nama,no){
  if(sedang){speechSynthesis.cancel(); sedang=false; return;}
  sedang=true;
  if(!nama) nama='pasien';
  let bersih=nama.replace(/[^a-zA-Z0-9 ]/g,' ').trim().substring(0,25);
  let teks=`Nomor antrian ${no}, atas nama ${bersih}, silakan masuk ke ruang dokter.`;
  speechSynthesis.cancel();
  setTimeout(()=>{
    let u=new SpeechSynthesisUtterance(teks);
    u.lang='id-ID'; u.rate=0.85; u.pitch=1; u.volume=1;
    let best=voices.find(v=>v.lang.toLowerCase().includes('id-ID'))||voices.find(v=>v.lang.toLowerCase().includes('id'))||voices[0];
    if(best) u.voice=best;
    u.onend=()=>{sedang=false;}; u.onerror=()=>{sedang=false;};
    speechSynthesis.speak(u);
  },100);
}
async function load(){try{const r=await fetch('/api/antrian');const d=await r.json();document.getElementById('info').innerText=d.length+' pasien antri';document.getElementById('list').innerHTML=d.map(k=>{
let nm=(k.nama||(k.pasien&&k.pasien.nama)||'pasien').replace(/'/g,'');
return `<div class="antri-item"><div style="display:flex;gap:12px;align-items:center"><div class="antri-no">#${k.no_antrian}</div><div><b>${nm}</b></div></div><button class="btn btn-p" onclick="panggil('${nm}','${k.no_antrian}')">🔊 PANGGIL</button></div>`
}).join('')||'<p>Tidak ada antrian</p>'}catch(e){document.getElementById('info').innerText='Error: '+e}}load()
</script></body></html>
