<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrian - dr. Galih</title>
<style>
body{font-family:system-ui; background:#f0f9ff; padding:20px; text-align:center}
.card{background:white; padding:20px; margin:12px auto; border-radius:16px; max-width:600px; box-shadow:0 4px 12px rgba(0,0,0,.1)}
.big{font-size:48px; font-weight:bold; color:#0369a1}
.btn{padding:14px 24px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin:5px}
.panggil{background:#0ea5e9; color:white; font-size:18px}
.rm{background:#10b981; color:white}
.selesai{background:#e5e7eb}
.suara{position:fixed; bottom:10px; right:10px; background:#fef3c7; padding:8px 12px; border-radius:20px; font-size:12px}
</style></head><body>
<h1>🩺 Antrian Hari Ini - Praktek dr. Galih</h1>
<a href="/">Form Daftar</a> | <a href="/riwayat.html">Riwayat</a> | <button onclick="load()">🔄 Refresh</button>
<div id="list">Loading...</div>
<div class="suara">🔊 Suara: Aktif</div>
<script>
let data=[]
async function load(){
  const res = await fetch('/api/antrian')
  data = await res.json()
  document.getElementById('list').innerHTML = data.map((p,i)=>`
    <div class="card">
      <div class="big">#${p.no_antrian}</div>
      <b style="font-size:20px">${p.nama}</b><br>
      <span>${p.no_rm}</span> | ${p.no_hp}<br>
      <small>${p.alamat}</small><br><br>
      <button class="btn panggil" onclick="panggil(${i})">📢 PANGGIL + SUARA</button>
      <a class="btn rm" href="/rm.html?no_rm=${p.no_rm}" style="text-decoration:none">📝 Periksa / RM</a>
    </div>
  `).join('') || '<p>Belum ada antrian hari ini</p>'
}
function panggil(i){
  const p = data[i]
  const teks = `Nomor antrian ${p.no_antrian}, ${p.nama}, silahkan masuk ke ruang periksa dokter Galih`
  const u = new SpeechSynthesisUtterance(teks)
  u.lang = 'id-ID'
  u.rate = 0.9
  speechSynthesis.speak(u)
  // getar + fullscreen effect
  if(navigator.vibrate) navigator.vibrate(300)
  document.body.style.background = '#fef3c7'
  setTimeout(()=>document.body.style.background='#f0f9ff', 1000)
}
load()
setInterval(load, 10000)
</script></body></html>
