<div class="header"><div>🏥 Praktek Mandiri dr. Galih | Rekam Medis</div><div><span id="jam"></span> | 30/10/2026 | dr_galih Dokter | <a href="/login.html" style="color:white">Logout</a></div></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a class="active" href="/antrian.html">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a><a href="/tambah.html">➕ Tambah</a><a href="/cari.html">🔍 Cari</a><a href="/obat.html">💊 Obat</a><a href="/icd10.html">📚 ICD-10</a><a href="/user.html">👥 User</a><a href="#">📊 Laporan ▼</a></div>
<div class="card"><h3 style="margin:0">🔢 Antrian Hari Ini - Praktek Mandiri</h3><div style="color:#64748b;margin-top:6px" id="info">Loading...</div><div id="list" style="margin-top:16px"></div></div>
<script>
let voices=[]
function loadVoices(){voices=speechSynthesis.getVoices()}
speechSynthesis.onvoiceschanged=loadVoices; loadVoices()
setInterval(()=>{let d=new Date();let el=document.getElementById('jam');if(el)el.innerText=d.toLocaleTimeString('id-ID')},1000)
function speak(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  // auto pilih cewek indo lembut tanpa pilih2
  let v=voices.find(x=>x.lang.toLowerCase().includes('id')&&x.name.toLowerCase().includes('female')) || voices.find(x=>x.lang.toLowerCase().includes('id')) || voices.find(x=>x.name.toLowerCase().includes('google indonesia')) || voices[0];
  if(v){u.voice=v; u.lang=v.lang}
  else u.lang='id-ID';
  u.rate=0.9; u.pitch=1.2;
  speechSynthesis.speak(u)
}
function panggil(nama,no){speak(`Nomor antrian ${no}, atas nama ${nama}, silakan masuk ke ruang dokter.`)}
async function load(){const r=await fetch('/api/antrian');const d=await r.json();document.getElementById('info').innerText=d.length+' pasien antri hari ini';document.getElementById('list').innerHTML=d.map(k=>`<div class="antri-item"><div style="display:flex;gap:16px;align-items:center"><div class="antri-no">#${k.no_antrian}</div><div><b>${k.nama||k.pasien?.nama}</b><br><small style="color:#64748b">${k.pasien?.no_rm||''} - ${k.keluhan||''}</small></div></div><div><button class="btn btn-panggil" onclick="panggil('${k.nama||k.pasien?.nama}','${k.no_antrian}')">🔊 PANGGIL</button> <a class="btn btn-rm" href="/rekam.html?id=${k.pasienId}" style="text-decoration:none">RM</a></div></div>`).join('')||'<p style=text-align:center;color:#64748b>Tidak ada antrian</p>'}load();setInterval(load,10000)
</script></body></html>
