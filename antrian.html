<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antrian - Praktek dr Galih</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f8fafc}
.header{background:linear-gradient(90deg,#2563eb,#1e40af);color:#fff;padding:14px 20px;display:flex;justify-content:space-between}
.nav{background:#fff;margin:14px 16px 0;border-radius:12px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;box-shadow:0 1px 3px #0001}
.nav a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#475569;font-size:13px;font-weight:600}.nav a.active{background:#2563eb;color:#fff}
.card{background:#fff;margin:14px 16px;border-radius:14px;padding:20px;box-shadow:0 1px 3px #0001}
.antri-item{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.antri-no{font-size:32px;font-weight:800;color:#1e40af;min-width:70px}
.btn{padding:10px 14px;border-radius:20px;border:none;cursor:pointer;font-weight:700;font-size:12px}
.btn-p{background:#ec4899;color:#fff}.btn-del{background:#fee2e2;color:#dc2626}.btn-s{background:#10b981;color:#fff}
.ok{background:#dcfce7;border:1px solid #86efac;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px;color:#166534}
</style></head><body>
<div class="header"><div><b>🏥 Praktek dr Galih | Antrian</b></div><div><span id="jam"></span></div></div>
<div class="nav"><a href="/dashboard.html">🏠 Dashboard</a><a class="active">🔢 Antrian</a><a href="/pasien.html">👥 Pasien</a><a href="/obat.html">💊 Obat</a><a href="/daftar-online.html">📝 Daftar Online</a></div>
<div class="card">
<div class="ok">✅ MODE LOKAL - Gak pake database - Pasti muncul! Gak akan error FUNCTION_INVOCATION_FAILED lagi!</div>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="margin:0">🔢 Antrian Hari Ini - <span id="tgl"></span> (<span id="info">0</span>)</h3><div><button class="btn btn-s" onclick="load()">🔄 Refresh</button><button class="btn btn-del" onclick="clearToday()">🗑️ Clear Hari Ini</button></div></div>
<div id="list" style="margin-top:16px">Loading...</div>
</div>
<script>
document.getElementById('tgl').innerText=new Date().toLocaleDateString('id-ID');
setInterval(()=>{document.getElementById('jam').innerText=new Date().toLocaleTimeString('id-ID')},1000);
function getAntrian(){try{return JSON.parse(localStorage.getItem('antrian_local')||'[]')}catch{return []}}
function setAntrian(a){localStorage.setItem('antrian_local',JSON.stringify(a))}
function panggil(nama,no){speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(`Nomor antrian ${no}, atas nama ${nama}, silakan masuk ke ruang dokter.`); u.lang='id-ID'; u.rate=0.85; speechSynthesis.speak(u);}
function load(){
 let all=getAntrian();
 let today=new Date().toDateString();
 let rows=all.filter(a=>new Date(a.created_at).toDateString()==today);
 document.getElementById('info').innerText=rows.length;
 if(rows.length==0){document.getElementById('list').innerHTML='<p style="text-align:center;padding:30px;color:#64748b">Belum ada antrian hari ini.<br><br>👉 Tambah dari <a href="/pasien.html">Pasien > +Antri</a></p>'; return;}
 document.getElementById('list').innerHTML=rows.sort((a,b)=>a.no_antrian-b.no_antrian).map(k=>{
   let nm=(k.nama||k.nama_pasien).replace(/'/g,'');
   let no=k.no_antrian;
   return `<div class="antri-item"><div style="display:flex;gap:14px;align-items:center"><div class="antri-no">#${no}</div><div><b>${nm}</b><div style="font-size:12px;color:#64748b">${k.alamat||''}</div></div></div><div style="display:flex;gap:6px"><button class="btn btn-p" onclick="panggil('${nm}','${no}')">🔊 PANGGIL</button><button class="btn btn-del" onclick="hapus('${k.id}')">❌</button></div></div>`
 }).join('');
}
function hapus(id){ if(!confirm('Hapus?')) return; let a=getAntrian().filter(x=>x.id!=id); setAntrian(a); load(); }
function clearToday(){ if(!confirm('Hapus semua antrian hari ini?')) return; let today=new Date().toDateString(); let a=getAntrian().filter(x=>new Date(x.created_at).toDateString()!=today); setAntrian(a); load(); }
load(); setInterval(load,5000);
</script></body></html>
