<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTRIAN</title>
<style>
  body{font-family:system-ui;background:#f5f7fb;margin:0;padding:20px}
  .header{text-align:center;margin-bottom:20px}
  .nav a{margin:0 5px;text-decoration:none;color:#0d6efd;font-size:14px}
  .card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
  .no{font-size:28px;font-weight:800;color:#333}
  .nama{font-weight:600;margin:4px 0}
  .rm{color:#666;font-size:13px;margin-bottom:8px}
  .btn{border:none;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;margin:2px}
  .btn-call{background:#0dcaf0;color:#000}
  .btn-rm{background:#d1f0e0;color:#000}
  .btn-hapus{background:#ff6b6b;color:#fff}
</style>
</head>
<body>

<div class="header">
      ANTRIAN
  <div class="nav">
    <a href="/">Daftar</a> | 
    <a href="/riwayat.html">Riwayat</a> | 
    <a href="/dashboard.html">Dashboard</a> | 
    <a href="/antrian.html"><b>Antrian</b></a>
  </div>
  <p id="jam" style="font-size:12px;color:#888"></p>
</div>

<div id="antrian-list">
  <div style="text-align:center;padding:40px">Loading antrian...</div>
</div>

<script>
let lastDataString = ''
let isLoading = false

function updateJam(){
  document.getElementById('jam').innerText = new Date().toLocaleString('id-ID')
}
setInterval(updateJam, 1000)
updateJam()

async function loadAntrian(){
  if(isLoading) return
  isLoading = true
  try{
    const res = await fetch('/api/antrian?t='+Date.now(), {cache:'no-store'})
    const data = await res.json()
    
    // ANTI KEDIP: kalau data sama, jangan render ulang
    const str = JSON.stringify(data)
    if(str === lastDataString){
      isLoading = false
      return
    }
    lastDataString = str

    const container = document.getElementById('antrian-list')
    
    if(!data || data.length === 0){
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#999">Belum ada antrian hari ini</div>'
      isLoading = false
      return
    }

    container.innerHTML = data.map(item => `
      <div class="card">
        <div class="no">#${item.no_antrian}</div>
        <div class="nama">${item.nama}</div>
        <div class="rm">${item.no_rm}</div>
        <button class="btn btn-call" onclick="panggil('${item.no_antrian}','${item.nama}')">🔊 PANGGIL - Suara Indo</button>
        <button class="btn btn-rm" onclick="location.href='/riwayat.html?no_rm=${item.no_rm}'">RM</button>
      </div>
    `).join('')

  }catch(e){
    console.error(e)
  }
  isLoading = false
}

function panggil(no, nama){
  if('speechSynthesis' in window){
    const text = `Nomor antrian ${no}, atas nama ${nama}, silakan masuk ke ruang pemeriksaan`
    const utter = new SpeechSynthesisUtterance(text)
    utter.lang = 'id-ID'
    utter.rate = 0.9
    speechSynthesis.cancel()
    speechSynthesis.speak(utter)
  } else {
    alert(`Panggil No ${no} - ${nama}`)
  }
}

// POLLING 3 DETIK - JANGAN 1 DETIK BIAR GAK BEREBUT / SALTO
setInterval(loadAntrian, 3000)
loadAntrian()
</script>

</body>
</html>
