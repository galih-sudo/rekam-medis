<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praktek Mandiri dr. Galih | Antrian</title><style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;flex-wrap:wrap}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 10px #0001}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}.antri-item{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}.antri-no{font-size:36px;font-weight:800;color:#1e40af}.btn{padding:10px 16px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600}.btn-panggil{background:#ec4899;color:#fff}.btn-rm{background:#e2e8f0;color:#334155}select{padding:10px;border-radius:12px;border:1px solid #e2e8f0;width:100%;margin:8px 0}</style></head><body>
<div class="header"><div>🏥 Praktek Mandiri dr. Galih | Rekam Medis</div><div><span id="jam"></span> | dr_galih Dokter | <a href="/login.html" style="color:white">Logout</a></div></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a class="active" href="/antrian.html">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a><a href="/tambah.html">➕ Tambah</a><a href="/cari.html">🔍 Cari</a><a href="/obat.html">💊 Obat</a><a href="/icd10.html">📚 ICD-10</a><a href="/user.html">👥 User</a><a href="#">📊 Laporan ▼</a></div>
<div class="card">
<h3 style="margin:0">🔊 Pilih Suara Mantan - Test Dulu Bro!</h3>
<select id="voiceSelect"><option>Loading suara...</option></select>
<div style="display:flex;gap:8px;margin-top:8px">
<button onclick="testSuara()" style="flex:1;padding:12px;background:#f3e8ff;border:none;border-radius:12px;font-weight:600">🎧 Test Suara Ini</button>
<button onclick="saveVoice()" style="flex:1;padding:12px;background:#10b981;color:white;border:none;border-radius:12px;font-weight:600">💾 Simpan Yang Ini!</button>
</div>
<div id="saved" style="margin-top:8px;color:green;font-size:13px"></div>
<div style="color:#64748b;margin-top:12px" id="info">Loading...</div>
<div id="list" style="margin-top:16px"></div>
</div>
<script>
let voices=[]
function loadVoices(){
  voices=speechSynthesis.getVoices();
  voiceSelect.innerHTML=voices.map((v,i)=>{
    let tag='';
    if(v.name.toLowerCase().includes('female')) tag+='💖 CEWEK ';
    if(v.lang==='id-ID') tag+='🇮🇩 INDO ';
    if(v.name.toLowerCase().includes('google')) tag+='⭐ ';
    return `<option value="${i}">${i}. ${tag} - ${v.name} (${v.lang})</option>`
  }).join('');
  // load saved
  let saved=localStorage.getItem('suaraMantan');
  if(saved) voiceSelect.value=saved;
}
speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,800); loadVoices();
setInterval(()=>{let d=new Date();let el=document.getElementById('jam');if(el)el.innerText=d.toLocaleTimeString('id-ID')},1000)

function speak(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  let idx=parseInt(voiceSelect.value);
  if(voices[idx]){u.voice=voices[idx]; u.lang=voices[idx].lang;}
  else u.lang='id-ID';
  u.rate=0.9; u.pitch=1.1; u.volume=1;
  speechSynthesis.speak(u);
  return voices[idx] ? voices[idx].name : 'default';
}
function testSuara(){
  let name=speak('Halo sayang, nomor antrian satu, atas nama Afwan Hafizi, silakan masuk ke ruang dokter. Ini suara nomor '+voiceSelect.value);
  saved.innerText='Testing: '+name;
}
function saveVoice(){
  localStorage.setItem('suaraMantan', voiceSelect.value);
  let v=voices[voiceSelect.value];
  saved.innerHTML='✅ DISIMPAN! Suara: <b>'+(v?v.name:'')+'</b> Nomor: '+voiceSelect.value+'<br>Kasih tau gue nomor '+voiceSelect.value+' bro, nanti gue deploy permanen jadi PANGGIL aja!';
}
function panggil(nama,no){
  if(!nama||nama==='undefined') nama='pasien';
  speak(`Nomor antrian ${no}, atas nama ${nama}, silakan masuk ke ruang dokter.`);
}
async function load(){const r=await fetch('/api/antrian');const d=await r.json();document.getElementById('info').innerText=d.length+' pasien antri hari ini';document.getElementById('list').innerHTML=d.map(k=>{
let nm=(k.nama||(k.pasien&&k.pasien.nama)||'pasien').replace(/'/g,'');
return `<div class="antri-item"><div style="display:flex;gap:16px;align-items:center"><div class="antri-no">#${k.no_antrian}</div><div><b>${nm}</b><br><small style="color:#64748b">${k.pasien?.no_rm||k.no_rm||''} - ${k.keluhan||''}</small></div></div><div><button class="btn btn-panggil" onclick="panggil('${nm}','${k.no_antrian}')">🔊 PANGGIL</button> <a class="btn btn-rm" href="/rekam.html?id=${k.pasienId}" style="text-decoration:none">RM</a></div></div>`
}).join('')||'<p style=text-align:center;color:#64748b>Tidak ada antrian</p>'}load();setInterval(load,10000)
</script></body></html>
