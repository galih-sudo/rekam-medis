<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obat - Praktek dr Galih</title>
<script>if(!localStorage.getItem('token')&&!localStorage.getItem('user')&&!localStorage.getItem('login_user')){location.href='/login.html'}</script>
<style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}</style>
</head><body>
<div class="header"><div>🏥 Praktek dr Galih</div><div><a href="#" onclick="localStorage.clear();location.href='/login.html'" style="color:#fff">Logout</a></div></div>
<div class="menu"><a href="/dashboard.html">🏠 Dashboard</a><a href="/antrian.html">🔢 Antrian</a><a href="/pasien.html">📋 Pasien</a><a class="active">💊 Obat</a></div>
<div class="marquee-bar" style="width:100%;background:#f0f9ff;overflow:hidden;white-space:nowrap;padding:9px 0;border-bottom:1px solid #dbeafe"><span style="display:inline-block;padding-left:100%;animation:marquee 20s linear infinite;color:#1d4ed8;font-size:13px;font-weight:700">🏥 Praktek Mandiri dr.Galih | 📍 Jl.Raya Sengkol Aikdarek | 😊 Melayani dengan senyum | 🕕 Buka setiap hari kerja jam 06.00-11.00 dan 17.00-21.00 WITA |</span></div><style>@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}</style>
<div class="card"><h3>💊 Data Obat</h3><div id="list">Loading...</div></div>
<script>
async function load(){try{const r=await fetch('/api/obat');const d=await r.json();document.getElementById('list').innerHTML=d.map(o=>`<div style="border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0"><b>${o.nama||o.nama_obat}</b> - Stok: ${o.stok||0}</div>`).join('')||'Tidak ada data'}catch(e){document.getElementById('list').innerText='Error: '+e}}load()
</script></body></html>
