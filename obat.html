<!DOCTYPE html>
<html lang="id"><head>

</script><head></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stok Obat - dr Galih</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dbeafe 0%,#f0fdfa 50%,#fef9c3 100%);background-attachment:fixed}
.header{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(59,130,246,.1);border-bottom:1px solid rgba(59,130,246,.1);position:sticky;top:0;z-index:10}
.header b{font-size:15px;background:linear-gradient(90deg,#2563eb,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn{border:0;padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:11px}
.btn-back{background:#fff;border:1px solid #e2e8f0;color:#334155}
.btn-save{background:linear-gradient(90deg,#2563eb,#06b6d4);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.container{max-width:900px;margin:0 auto;padding:18px}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid rgba(255,255,255,.9);margin-bottom:16px}
.input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;font-size:13px;margin-bottom:10px}
.input:focus{outline:none;border-color:#3b82f6;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;margin-top:12px}th{font-size:9px;color:#94a3b8;text-align:left;padding:10px 8px;border-bottom:1px solid #f1f5f9;text-transform:uppercase}td{padding:10px 8px;border-bottom:1px solid #f8fafc;font-size:12px}
</style>
</head>
<script>if(!localStorage.getItem("login_drg"))location.href="/login.html";</script>
<body>
<div class="header"><b>💊 Stok Obat & ED - dr Galih</b><div style="display:flex;gap:8px"><button onclick="location.href='./dashboard.html'" class="btn btn-back">← Dashboard</button><button onclick="logout()" class="btn" style="background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff">Logout</button></div></div>
<div class="container">
<div id="aksesDitolak" style="display:none" class="card"><h3 style="color:#dc2626">🔒 Akses Ditolak</h3><p style="font-size:13px;color:#64748b">Halaman Stok Obat hanya bisa diakses oleh <b>Dokter</b>. Akun <b>Perawat</b> tidak diizinkan. Silakan login sebagai Dokter.</p><button onclick="location.href='./dashboard.html'" class="btn btn-back">Kembali ke Dashboard</button></div>
<div id="kontenObat">
<div class="card"><b style="font-size:14px">➕ Entri Stok Obat Baru</b><div style="margin-top:12px"><input id="namaObat" class="input" placeholder="Nama Obat (contoh: Amoxicillin 500mg)" autocomplete="off" autocorrect="off" spellcheck="false"><div class="grid"><input id="stokObat" class="input" type="number" placeholder="Stok Awal"><input id="hargaObat" class="input" type="number" placeholder="Harga"><input id="edObat" class="input" type="date"></div><button onclick="simpanObat()" class="btn btn-save" style="width:100%;padding:12px">💾 Simpan Obat</button></div></div>
<div class="card"><b style="font-size:14px">📦 Daftar Stok & ED</b><input id="cariObat" class="input" placeholder="🔍 Cari obat..." oninput="renderObat()" style="margin-top:10px" autocomplete="off" autocorrect="off" spellcheck="false"><table><thead><tr><th>Nama Obat</th><th>Stok</th><th>Harga</th><th>ED</th><th>Aksi</th></tr></thead><tbody id="listObat"></tbody></table></div>
</div>
</div>
<script>
if(!localStorage.getItem('isLogin')){location.href='./login.html';}
var role=localStorage.getItem('role')||'dokter';
if(role!=='dokter'){
document.getElementById('aksesDitolak').style.display='block';
document.getElementById('kontenObat').style.display='none';
} else {
document.getElementById('aksesDitolak').style.display='none';
document.getElementById('kontenObat').style.display='block';
}
function getObat(){return JSON.parse(localStorage.getItem('stokObatV8')||'[]')}
function simpanObat(){
var nama=document.getElementById('namaObat').value.trim();
var stok=parseInt(document.getElementById('stokObat').value)||0;
var harga=parseInt(document.getElementById('hargaObat').value)||0;
var ed=document.getElementById('edObat').value;
if(!nama){alert('Nama obat harus diisi!');return;}
var data=getObat();
data.push({id:Date.now().toString(),nama:nama,stok:stok,harga:harga,ed:ed});
localStorage.setItem('stokObatV8',JSON.stringify(data));
document.getElementById('namaObat').value='';document.getElementById('stokObat').value='';document.getElementById('hargaObat').value='';document.getElementById('edObat').value='';
renderObat();
alert('Obat '+nama+' berhasil disimpan!');
}
function hapusObat(id){
if(!confirm('Hapus obat ini?'))return;
var data=getObat().filter(function(o){return o.id!==id});
localStorage.setItem('stokObatV8',JSON.stringify(data));
renderObat();
}
function renderObat(){
var q=(document.getElementById('cariObat').value||'').toLowerCase();
var all=getObat().filter(function(o){return o.nama.toLowerCase().indexOf(q)!==-1});
var tbody=document.getElementById('listObat');
var html='';
var today=new Date().toISOString().slice(0,10);
for(var i=0;i<all.length;i++){
var o=all[i];
var edStatus='';
if(o.ed){
if(o.ed<today)edStatus='<span style="background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800">EXPIRED</span>';
else if(new Date(o.ed)-new Date()<30*24*60*60*1000)edStatus='<span style="background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800">Hampir ED</span>';
}
var stokColor=o.stok<10?'#dc2626':'#0f172a';
html+='<tr><td><b>'+o.nama+'</b> '+edStatus+'</td><td style="color:'+stokColor+';font-weight:800">'+o.stok+'</td><td>Rp '+(o.harga||0).toLocaleString('id-ID')+'</td><td style="font-size:11px">'+(o.ed||'-')+'</td><td><button onclick="hapusObat(\''+o.id+'\')" style="border:0;background:#fee2e2;color:#dc2626;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer">Hapus</button></td></tr>';
}
if(!html)html='<tr><td colspan="5" style="text-align:center;padding:20px;color:#94a3b8;font-size:12px">Belum ada data obat</td></tr>';
tbody.innerHTML=html;
}
function logout(){localStorage.removeItem('isLogin');location.href='./login.html';}
renderObat();
</script>
</body></html>
