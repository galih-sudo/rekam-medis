<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praktek Mandiri dr. Galih | Obat</title><style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 10px #0001}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001}table{width:100%;border-collapse:collapse;font-size:14px}th{color:#64748b;padding:12px 8px;border-bottom:1px solid #e2e8f0;text-align:left}td{padding:12px 8px;border-bottom:1px solid #f1f5f9}.btn{padding:6px 12px;border-radius:20px;border:none;background:#dbeafe;color:#1d4ed8}.btn-tambah{background:#10b981;color:#fff;padding:8px 14px;border-radius:20px;float:right;border:none}</style></head><body>

<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">💊 Daftar Obat</h3><button class="btn-tambah" onclick="tambah()">+ Tambah Obat</button></div><table style="margin-top:16px"><thead><tr><th>NAMA</th><th>STOK</th><th>SATUAN</th><th>AKSI</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>async function load(){const r=await fetch('/api/obat');const d=await r.json();tb.innerHTML=d.map(o=>`<tr><td>${o.nama}</td><td>${o.stok}</td><td>${o.satuan||''}</td><td><button class="btn">Edit</button> <button class="btn">Hapus</button></td></tr>`).join('')}async function tambah(){let n=prompt('Nama:');if(!n)return;let s=prompt('Stok:','100');let u=prompt('Satuan:','tablet');await fetch('/api/obat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nama:n,stok:parseInt(s),satuan:u})});load()}load()</script></body></html>
