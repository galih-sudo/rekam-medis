<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Online - Praktek dr Galih - ANTI TYPO</title>
<style>
body{font-family:system-ui;padding:20px;max-width:480px;margin:auto}
input{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
input:focus{border-color:#0ea5e9;outline:none}
.btn{width:100%;padding:14px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-size:18px;font-weight:bold}
.preview{background:#f0f9ff;padding:12px;border-radius:8px;margin:10px 0;display:none}
.ok{color:green} .typo{color:red;font-weight:bold}
</style>
</head>
<body>
<h2>📋 Daftar Online - Mantang</h2>
<p>50 pasien/hari - cek dulu biar gak jadi Maling Ramadan 😂</p>

<input id="nama" placeholder="Nama lengkap" autocomplete="name">
<div id="preview" class="preview"></div>

<input id="hp" placeholder="No HP (contoh 0812xxxx)" inputmode="numeric">
<input id="alamat" placeholder="Alamat (pilih Desa Mantang)" list="desaMantan">
<datalist id="desaMantan">
  <option value="Mantan Daye">
  <option value="Mantan Lauk">
  <option value="Mantan Tengah">
  <option value="Batukliang">
  <option value="Praya">
</datalist>

<button class="btn" onclick="daftar()">CEK & DAFTAR</button>
<div id="status"></div>

<script>
const $ = id => document.getElementById(id);

// 1. AUTO BENERIN - ANTI MALIG
$('nama').addEventListener('input', () => {
  let raw = $('nama').value;
  // Trim double spasi, Capitalize tiap kata
  let fixed = raw.replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());

  // Preview live
  if(fixed.length > 2){
    $('preview').style.display='block';
    // Cek kata aneh "Maling" - kasih warning
    if(fixed.toLowerCase().includes('maling')){
      $('preview').innerHTML = `⚠️ Yakin namanya <span class="typo">${fixed}</span>? Bukan <span class="ok">Malang</span>?`;
    } else {
      $('preview').innerHTML = `Preview: <span class="ok">${fixed}</span> - Sudah benar?`;
    }
  }
  // Auto isi yang bener
  if(raw !== fixed && raw.length > 3){
    // Jangan auto replace pas ngetik, cuma preview
  }
});

async function daftar(){
  let namaRaw = $('nama').value.trim();
  let nama = namaRaw.replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  let hp = $('hp').value.trim();
  let alamat = $('alamat').value.trim();

  if(nama.length < 3) return alert('Nama kependekan bro!');

  // 2. KONFIRMASI SIANG BOLONG - BIAR MELEK
  let ok = confirm(`CEK LAGI BRO:\n\nNama: ${nama}\nHP: ${hp}\nAlamat: ${alamat}\n\nYakin sudah BENAR? (jangan jadi Maling Ramadan lagi)`);
  if(!ok) return;

  $('status').innerHTML = '⏳ Nyimpen ke Prisma 2GB...';

  // 3. KIRIM KE VERCEL PRISMA
  try{
    let res = await fetch('/api/daftar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nama, hp, alamat})
    });
    let data = await res.json();
    if(data.no_rm){
      $('status').innerHTML = `✅ SUKSES! No RM: <b>${data.no_rm}</b><br>Nama: ${data.nama}<br>Silakan ke praktek!`;
      $('nama').value=''; $('hp').value=''; $('alamat').value='';
      $('preview').style.display='none';
    } else {
      $('status').innerHTML = `❌ ${data.error || 'Gagal'}`;
    }
  }catch(e){
    $('status').innerHTML = '❌ Koneksi error - cek Vercel!';
  }
}
</script>
</body>
</html>
