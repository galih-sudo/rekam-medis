<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Surat Sakit - Praktek Mandiri dr. Galih</title><style>body{font-family:Times New Roman,serif;margin:30px;max-width:700px;line-height:1.6}@media print{button{display:none}} .kop{text-align:center;border-bottom:3px double #000;padding-bottom:12px;margin-bottom:20px}</style><script>if(!localStorage.getItem("token")</head></head>!localStorage.getItem("user")</head></head>!localStorage.getItem("login_user")){location.href="/login.html"}</script></head><body>
<div class="kop"><b style="font-size:20px">PRAKTEK MANDIRI dr. GALIH</b><br>Surat Keterangan Sakit<br><small>Jl. Mataram, NTB | SIP: xxxx</small></div>
<div id="isi">Loading...</div>
<button onclick="window.print()" style="padding:12px 20px;background:#3b82f6;color:white;border:none;border-radius:10px">🖨️ Cetak Surat Sakit</button>
<script>
const q=new URLSearchParams(location.search); const nama=q.get('nama')||''; const umur=q.get('umur')||''; const diagnosa=q.get('diagnosa')||''; const hari=q.get('hari')||'2';
document.getElementById('isi').innerHTML=`
<p style="text-align:center"><b><u>SURAT KETERANGAN SAKIT</u></b><br>No: ${Math.floor(Math.random()*1000)}/SKS/${new Date().getFullYear()}</p>
<p>Yang bertanda tangan di bawah ini, dokter praktek mandiri dr. Galih menerangkan bahwa:</p>
<table><tr><td>Nama</td><td>: <b>${nama}</b></td></tr><tr><td>Umur</td><td>: ${umur} tahun</td></tr><tr><td>Diagnosa</td><td>: ${diagnosa}</td></tr></table>
<p>Karena sakitnya tersebut, perlu istirahat selama <b>${hari} hari</b>, terhitung mulai tanggal ${new Date().toLocaleDateString('id-ID')} s/d ${new Date(Date.now()+parseInt(hari)*86400000).toLocaleDateString('id-ID')}.</p>
<p>Demikian surat ini dibuat agar dapat dipergunakan sebagaimana mestinya.</p>
<div style="text-align:right;margin-top:50px">Mataram, ${new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}<br><br><br><br><b>dr. Galih</b></div>
`;
setTimeout(()=>window.print(),800)
</script></body></html>
