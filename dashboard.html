<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DASHBOARD</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:system-ui;background:#f0f9ff;padding:15px;max-width:1100px;margin:auto}.card{background:white;padding:18px;margin:10px 0;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}.stat{text-align:center}.stat h2{font-size:36px;margin:5px;color:#0369a1}</style></head><body>
<script>if(!localStorage.getItem("login_drg"))location.href="/login.html";</script>
<h1>DASHBOARD
<a href="/">Daftar</a> | <a href="/antrian.html">Antrian</a> | <a href="/riwayat.html">Riwayat</a> | <button onclick="load()">Refresh</button>
<div class="grid4"><div class="card stat"><div>Total Pasien</div><h2 id="totalPasien">-</h2></div><div class="card stat"><div>Hari Ini</div><h2 id="hariIni" style="color:#10b981">-</h2></div><div class="card stat"><div>Total Kunjungan</div><h2 id="totalKunjungan">-</h2></div><div class="card stat"><div>Stok Kritis</div><h2 id="stokKritis" style="color:#ef4444">-</h2></div></div>
<div class="card"><canvas id="chart7"></canvas></div>
<script>async function load(){const r=await fetch('/api/laporan');const d=await r.json();totalPasien.innerText=d.totalPasien;hariIni.innerText=d.hariIni;totalKunjungan.innerText=d.totalKunjungan;stokKritis.innerText=d.stokMenipis.length;new Chart(chart7,{type:'bar',data:{labels:d.kunjungan7hari.map(x=>new Date(x.tgl).toLocaleDateString('id-ID')),datasets:[{label:'Pasien',data:d.kunjungan7hari.map(x=>x.jumlah),backgroundColor:'#0ea5e9'}]}})}load();function logout(){localStorage.removeItem('login_drg');location.href='/login.html';}</script>
<button onclick="logout()" style="position:fixed;bottom:20px;right:20px;background:#ef4444;color:white;border:0;padding:10px 16px;border-radius:10px">Logout</button>
</body></html>
