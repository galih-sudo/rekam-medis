<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekam Medis V6.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f5f7fb}header{background:#111827;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.container{max-width:1000px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:16px}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{padding:10px 16px;background:#111827;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:600}button.green{background:#16a34a}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#f9fafb}.loading{opacity:.5}</style></head><body>
<header><b>🏥 Rekam Medis V6.1 - SUPABASE</b><div><span id="userInfo"></span> <button onclick="logout()" style="background:#374151;margin-left:10px">Logout</button></div></header>
<div class="container">
<div class="card"><h3>Tambah Pasien Baru</h3><input id="nama" placeholder="Nama Pasien"><input id="umur" type="number" placeholder="Umur"><textarea id="keluhan" placeholder="Keluhan"></textarea><textarea id="diagnosa" placeholder="Diagnosa"></textarea><input id="obat" placeholder="Obat"><button class="green" id="btnSimpan" onclick="tambahPasien()">+ Simpan ke Supabase</button><p id="status" style="font-size:12px;color:#666"></p></div>
<div class="card"><h3>Data Pasien (Live dari Supabase)</h3><button onclick="loadPasien()">🔄 Refresh</button><table><thead><tr><th>Nama</th><th>Umur</th><th>Keluhan</th><th>Diagnosa</th><th>Obat</th><th>Waktu</th></tr></thead><tbody id="list"></tbody></table></div>
</div>
<script>
const SUPABASE_URL = "https://gfkacaaairtwpbddingt.supabase.co";
const SUPABASE_KEY = "sb_publishable_jAbUqEKBWbs7CoupX3SHfQ_JsLpyNbS";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const u=localStorage.getItem("pm_user"); if(!u) location.href="index.html"; document.getElementById("userInfo").innerText=JSON.parse(u).email;
async function loadPasien(){ document.getElementById("list").innerHTML="<tr><td colspan=6>Loading...</td></tr>"; const {data,error}=await sb.from("pasien").select("*").order("created_at",{ascending:false}); if(error){ document.getElementById("list").innerHTML=`<tr><td colspan=6 style=color:red>Error: ${error.message}. Pastikan udah bikin table pasien di SQL Editor!</td></tr>`; return;} document.getElementById("list").innerHTML=data.map(p=>`<tr><td>${p.nama}</td><td>${p.umur}</td><td>${p.keluhan}</td><td>${p.diagnosa}</td><td>${p.obat}</td><td>${new Date(p.created_at).toLocaleString('id-ID')}</td></tr>`).join('') || "<tr><td colspan=6>Belum ada data</td></tr>"; }
async function tambahPasien(){ const btn=document.getElementById("btnSimpan"); btn.disabled=true; btn.innerText="Menyimpan..."; const payload={nama:document.getElementById('nama').value,umur:parseInt(document.getElementById('umur').value)||null,keluhan:document.getElementById('keluhan').value,diagnosa:document.getElementById('diagnosa').value,obat:document.getElementById('obat').value}; if(!payload.nama){ alert("Nama wajib!"); btn.disabled=false; btn.innerText="+ Simpan ke Supabase"; return;} const {error}=await sb.from("pasien").insert([payload]); if(error){ alert("Gagal: "+error.message); } else { document.querySelectorAll('input,textarea').forEach(i=>i.value=''); document.getElementById("status").innerText="✅ Berhasil disimpan ke Supabase!"; loadPasien(); } btn.disabled=false; btn.innerText="+ Simpan ke Supabase"; }
function logout(){ localStorage.removeItem("pm_user"); location.href="index.html"; }
loadPasien();
</script></body></html>
