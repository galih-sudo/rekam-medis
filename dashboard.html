<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard dr Galih - CLEAN</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:system-ui;background:#f0f9ff;padding:15px;max-width:1100px;margin:auto}.card{background:white;padding:18px;margin:10px 0;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}.stat{text-align:center}.stat h2{font-size:36px;margin:5px;color:#0369a1}.badge{padding:4px 10px;border-radius:20px;color:white;font-size:12px}.red{background:#ef4444}.yellow{background:#f59e0b}.green{background:#10b981}</style></head><body>
<script>if(!localStorage.getItem("login_drg"))location.href="/login.html";</script>
<h1>📊 DASHBOARD BOS KLINIK dr. Galih - VERSI BERSIH</h1>
<a href="/">Daftar</a> | <a href="/antrian.html">Antrian</a> | <a href="/riwayat.html">Riwayat</a> | <a href="/log.html">Log</a> | <button onclick="load()">🔄 Refresh</button>
<div class="grid4"><div class="card stat"><div>Total Pasien</div><h2 id="totalPasien">-</h2></div><div class="card stat"><div>Hari Ini</div><h2 id="hariIni" style="color:#10b981">-</h2></div><div class="card stat"><div>Total Kunjungan</div><h2 id="totalKunjungan">-</h2></div><div class="card stat"><div>Stok Kritis</div><h2 id="stokKritis" style="color:#ef4444">-</h2></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="card"><h3>📈 Kunjungan 7 Hari</h3><canvas id="chart7"></canvas></div><div class="card"><h3>🏆 Diagnosa Terbanyak</h3><div id="topDiagnosa"></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="card"><h3>💊 Obat Paling Laku</h3><div id="obatLaku"></div></div><div class="card"><h3>⚠ Stok Menipis</h3><div id="stokMenipis"></div></div></div>
<script>async function load(){try{const r=await fetch('/api/laporan');const d=await r.json();totalPasien.innerText=d.totalPasien;hariIni.innerText=d.hariIni;totalKunjungan.innerText=d.totalKunjungan;stokKritis.innerText=d.stokMenipis.length;new Chart(chart7,{type:'bar',data:{labels:d.kunjungan7hari.map(x=>new Date(x.tgl).toLocaleDateString('id-ID',{day:'2-digit',month:'short'})),datasets:[{label:'Pasien',data:d.kunjungan7hari.map(x=>x.jumlah),backgroundColor:'#0ea5e9'}]}});topDiagnosa.innerHTML=d.topDiagnosa.map((x,i)=>`${i+1}. <b>${x.icd10_code||''} ${x.diagnosa}</b> - ${x._count.diagnosa}x`).join('<br>')||'Belum ada';obatLaku.innerHTML=d.obatLaku.map((x,i)=>`${i+1}. <b>${x.obat||'-'}</b> - ${x._count.obat}x`).join('<br>')||'Belum ada';stokMenipis.innerHTML=d.stokMenipis.map(o=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>${o.nama}</span><span class="badge ${o.stok==0?'red':o.stok<=5?'red':'yellow'}">${o.stok}</span></div>`).join('')||'<span class="badge green">Aman</span>';}catch(e){}}load();function logout(){localStorage.removeItem('login_drg');location.href='/login.html';}</script>
<button onclick="logout()" style="position:fixed;bottom:20px;right:20px;background:#ef4444;color:white;border:0;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer">Logout</button>
</body></html>
