<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Aktivitas</title><style>body{font-family:system-ui;background:#f8fafc;margin:0;padding:20px} table{width:100%;background:white;border-radius:12px;overflow:hidden;border-collapse:collapse} th{background:#0f172a;color:white;padding:12px;text-align:left;font-size:12px} td{padding:10px;border-bottom:1px solid #eee;font-size:13px} h2{margin:0 0 16px}</style></head><body><script>if(!localStorage.getItem('login_drg')) location.href='/login.html';</script><h2>📋 Log Aktivitas <a href="/dashboard.html" style="font-size:12px">← Kembali</a></h2><table><thead><tr><th>Waktu</th><th>User</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table><script>
let logs=JSON.parse(localStorage.getItem('log_aktivitas')||'[]');
document.getElementById('tbody').innerHTML = logs.map(l=>`<tr><td>${l.waktu}</td><td>${l.user}</td><td>${l.aksi}</td></tr>`).join('') || '<tr><td colspan=3 style="text-align:center;color:#999">Belum ada aktivitas</td></tr>';
</script></body></html>
