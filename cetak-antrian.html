<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Karcis Antrian - Praktek Mandiri</title><style>body{font-family:system-ui;display:flex;justify-content:center;background:#eef2f7;margin:0;padding:20px}@media print{body{background:white} button{display:none}} .karcis{background:white;width:300px;border:2px dashed #1e40af;border-radius:16px;padding:20px;text-align:center}</style></head><body>
<div class="karcis"><b>🏥 Praktek Mandiri<br>dr. Galih</b><hr style="border:1px dashed #1e40af"><small id="tgl"></small><div id="no" style="font-size:72px;font-weight:900;color:#1e40af;margin:10px 0">#1</div><div id="nama" style="font-weight:600"></div><div id="rm" style="color:#64748b;font-size:12px"></div><hr style="border:1px dashed #1e40af"><small>Silakan tunggu panggilan<br>Terima Kasih</small><br><button onclick="window.print()" style="margin-top:16px;padding:10px 16px;background:#1e40af;color:white;border:none;border-radius:20px;width:100%">🖨️ Cetak Karcis</button></div>
<script>
const q=new URLSearchParams(location.search); document.getElementById('no').innerText='#'+(q.get('no')||'1'); document.getElementById('nama').innerText=q.get('nama')||''; document.getElementById('rm').innerText=q.get('rm')||''; document.getElementById('tgl').innerText=new Date().toLocaleString('id-ID'); setTimeout(()=>window.print(),800)
</script></body></html>
