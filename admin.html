<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Pasien - Rekam Medis</title>
<style>
body{font-family:sans-serif;padding:15px;background:#f5f5f5}
h2{margin:0 0 10px}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
th{background:#0d6efd;color:white}
.btn-icon{background:none;border:none;cursor:pointer;font-size:18px;padding:4px 6px}
.btn-icon:hover{opacity:.6}
.btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer}
.save{background:#198754;color:white;width:100%;margin-top:10px;padding:10px}
input{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
#formEdit{display:none;margin-top:15px;padding:15px;background:#fff3cd;border-radius:10px}
</style>
<script>if(!localStorage.getItem("token")</head></head>!localStorage.getItem("user")</head></head>!localStorage.getItem("login_user")){location.href="/login.html"}</script></head>
<script>if(!localStorage.getItem("login_drg"))location.href="/login.html";</script>
<body>
<h2>📋 Admin Pasien - Online</h2>
<div class="card">
<button class="btn" onclick="load()">🔄 Refresh</button>
<span id="count"></span>
<table>
<thead><tr><th>No RM</th><th>Nama</th><th>HP</th><th>Alamat</th><th>Aksi</th></tr></thead>
<tbody id="tbody"><tr><td colspan=5>Loading...</td></tr></tbody>
</table>
<div id="formEdit">
<h3>✏️ Edit Pasien <span id="editRM"></span></h3>
<input type="hidden" id="editId">
<input id="editNama" placeholder="Nama">
<input id="editHp" placeholder="No HP">
<input id="editAlamat" placeholder="Alamat">
<button class="btn save" onclick="saveEdit()">💾 Simpan Perubahan</button>
<button class="btn" onclick="document.getElementById('formEdit').style.display='none'">Batal</button>
</div>
</div>
<script>
const API='/api/pasien';
async function load(){
  const res=await fetch(API);
  const data=await res.json();
  document.getElementById('count').innerText=`Total: ${data.length}`;
  document.getElementById('tbody').innerHTML=data.map(p=>`
    <tr>
      <td><b>${p.no_rm}</b></td>
      <td>${p.nama}</td>
      <td>${p.no_hp||'-'}</td>
      <td>${p.alamat||'-'}</td>
      <td>
        <button class="btn-icon" onclick="openEdit(${p.id},'${p.no_rm}','${p.nama}','${p.no_hp||''}','${(p.alamat||'').replace(/'/g,'')}')">✏️</button>
        <button class="btn-icon" onclick="hapus(${p.id},'${p.no_rm}')">🗑️</button>
      </td>
    </tr>`).join('');
}
function openEdit(id,no_rm,nama,hp,alamat){
  document.getElementById('formEdit').style.display='block';
  document.getElementById('editId').value=id;
  document.getElementById('editRM').innerText=no_rm;
  document.getElementById('editNama').value=nama;
  document.getElementById('editHp').value=hp;
  document.getElementById('editAlamat').value=alamat;
  window.scrollTo(0,document.body.scrollHeight);
}
async function saveEdit(){
  const id=document.getElementById('editId').value;
  const body={nama:document.getElementById('editNama').value,no_hp:document.getElementById('editHp').value,alamat:document.getElementById('editAlamat').value};
  const res=await fetch(`${API}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok){alert('✅ Berhasil diupdate!');document.getElementById('formEdit').style.display='none';load();}else{const e=await res.text();alert('❌ Gagal: '+e);}
}
async function hapus(id,no_rm){
  if(!confirm(`Hapus ${no_rm}?`))return;
  const res=await fetch(`${API}/${id}`,{method:'DELETE'});
  if(res.ok){alert('🗑️ Dihapus');load();}else alert('Gagal hapus');
}
load();
</script>
</body>
</html>
