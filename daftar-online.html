<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAFTAR</title>
<style>body{font-family:system-ui;padding:20px;max-width:480px;margin:auto}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:14px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold}</style>
</head>
<body>
<h2>DAFTAR</h2>
<form id="formDaftar" onsubmit="return daftar(event)">
<input name="nama" placeholder="Nama Lengkap" required>
<input name="no_hp" placeholder="No HP">
<input name="alamat" placeholder="Alamat">
<textarea name="keluhan" placeholder="Keluhan"></textarea>
<button type="submit" id="btn">Daftar Sekarang</button>
</form>
<div id="msg" style="margin-top:16px;font-weight:bold"></div>
<script>
async function daftar(e){
 e.preventDefault();
 const btn=document.getElementById('btn'); btn.disabled=true; btn.innerText='Mendaftar...';
 const fd=new FormData(e.target);
 const body=Object.fromEntries(fd.entries());
 try{
  const res=await fetch('/api/daftar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await res.json();
  console.log(j);
  if(j.success){
    document.getElementById('msg').innerHTML='✅ Berhasil Daftar! No RM: '+j.pasien.no_rm+'<br><a href="./antrian.html">Lihat Antrian</a>';
    e.target.reset();
  } else {
    document.getElementById('msg').innerText='❌ Gagal: '+(j.error||'error');
  }
 }catch(err){ document.getElementById('msg').innerText='❌ Error: '+err.message; }
 btn.disabled=false; btn.innerText='Daftar Sekarang';
 return false;
}
</script>
</body>
</html>
