<!DOCTYPE html>
<html lang="id"><head><script>if(!localStorage.getItem("login_drg")<head><head>!location.pathname.includes("login.html")){location.href="/login.html"}</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Online Praktek Mandiri dr Galih</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dbeafe 0%,#e0f2fe 30%,#f0fdfa 60%,#fef9c3 100%);padding:16px}
.wrapper{width:100%;max-width:1100px;display:flex;align-items:center;gap:40px;justify-content:center;flex-wrap:wrap}
.hero-side{flex:1 1 520px;max-width:620px}
.hero-side picture img{width:100%;height:auto;border-radius:24px;box-shadow:0 20px 60px rgba(37,99,235,.15);display:block}
.hero-text{margin-top:16px}
.hero-text h1{font-size:32px;line-height:1.1;margin:0;color:#0f172a}
.hero-text h1 span{background:linear-gradient(90deg,#2563eb,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:#64748b;font-size:13.5px;line-height:1.6;margin-top:8px}
.card{flex:1 1 380px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(59,130,246,.15);border:1px solid rgba(255,255,255,.9);max-width:420px}
.card h2{margin:0;text-align:center;font-size:20px;color:#0f172a}
.card .sub{font-size:11px;color:#94a3b8;text-align:center;margin-top:6px;margin-bottom:18px}
.label{font-size:12px;font-weight:700;color:#334155;margin:12px 0 6px 4px;display:block}
.input{width:100%;padding:14px 16px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc;font-size:13.5px;transition:.2s}
.input:focus{outline:none;border-color:#3b82f6;background:#fff;box-shadow:0 0 0 4px #dbeafe}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#0ea5e9,#06b6d4);color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:18px;box-shadow:0 4px 16px rgba(14,165,233,.3);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.back{text-align:center;margin-top:14px}
.back a{font-size:12px;color:#2563eb;text-decoration:none;font-weight:600}
.footer{text-align:center;margin-top:12px;font-size:10px;color:#94a3b8}
@media(max-width:900px){
.wrapper{flex-direction:column}
.hero-side{order:2;max-width:380px}
.card{order:1}
.hero-text h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrapper">
<div class="hero-side">
<picture>
  <source media="(max-width: 900px)" srcset="hero-mobile.png">
  <img src="hero-desktop.png" alt="Daftar Antrian AVICENA" loading="eager">
</picture>
<div class="hero-text">
<h1>Daftar Dari Rumah, <span>Tanpa Antre!</span></h1>
<p>Cukup isi HP & Alamat, datang sesuai jam praktek. Sistem otomatis catat antrian.</p>
</div>
</div>

<div class="card">
<h2>Daftar Online Praktek dr. Galih</h2>
<div class="sub">Praktek Mandiri - Sengkol-Aikdarek, Batukliang, Lombok Tengah</div>

<label class="label">Nama Lengkap</label>
<input id="nama" class="input" placeholder="Contoh: Afwan Hafizi">

<label class="label">No. HP / WhatsApp</label>
<input id="hp" class="input" placeholder="Contoh: 0812xxxx">

<label class="label">Alamat</label>
<input id="alamat" class="input" placeholder="Contoh: Pejeruk Ampenan">

<button class="btn" onclick="daftar()">Daftar Sekarang 🚀</button>

<div class="back"><a href="./index.html">← Kembali ke Login</a></div>
<div class="footer">© Rekam Medis Praktek Mandiri dr.Galih</div>
</div>
</div>

<script>
async function daftar(){
var nama=document.getElementById('nama').value.trim();
var hp=document.getElementById('hp').value.trim();
var alamat=document.getElementById('alamat').value.trim();
if(!nama||!hp||!alamat){alert('Lengkapi semua data bro!');return;}
try{
var res=await fetch('/api/daftar',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({nama:nama,nama_lengkap:nama,no_hp:hp,hp:hp,no_wa:hp,alamat:alamat,keluhan:'-',sumber:'daftar-online'})
});
var text=await res.text();
let j={};
try{j=JSON.parse(text)}catch{j={raw:text}}
if(res.ok){
alert('SUKSES! No Antrian: '+ (j.no_antrian||j.nomor_antrian||j.id||'-') +' - Datang jam praktek ya!');
location.href='./index.html';
}else{
console.error(j);
alert('Gagal: '+(j.error||j.message||text||'Cek console'));
}
}catch(e){
console.error(e);
alert('Error koneksi, simpan offline dulu');
var list=JSON.parse(localStorage.getItem('daftarOnlineV1')||'[]');
list.push({nama, no_hp:hp, alamat, tgl:new Date().toISOString()});
localStorage.setItem('daftarOnlineV1',JSON.stringify(list));
location.href='./index.html';
}
}
</script>

<script>
function simpanKeAntrian(nama, hp, keluhan){
  let antri = JSON.parse(localStorage.getItem('antrian_drg')||'[]');
  antri.push({id:Date.now(), nama:nama, hp:hp, keluhan:keluhan||'-', waktu:new Date().toLocaleString('id-ID'), status:'Menunggu', sumber:'Online'});
  localStorage.setItem('antrian_drg', JSON.stringify(antri));
  // LOG
  let logs=JSON.parse(localStorage.getItem('log_aktivitas')||'[]');
  logs.unshift({waktu:new Date().toLocaleString('id-ID'), user:'Pasien '+nama, aksi:'Daftar Online'});
  localStorage.setItem('log_aktivitas', JSON.stringify(logs.slice(0,100)));
}
// Override fungsi daftar yang lama kalau ada
document.addEventListener('DOMContentLoaded', ()=>{
  const form = document.querySelector('form');
  if(form){
    form.addEventListener('submit', (e)=>{
      const nama = document.querySelector('[name=nama], #nama')?.value || 'Pasien';
      const hp = document.querySelector('[name=hp], #hp, [name=wa]')?.value || '';
      const keluhan = document.querySelector('[name=keluhan], #keluhan')?.value || '';
      simpanKeAntrian(nama, hp, keluhan);
    });
  }
});
</script>
</body></html>
