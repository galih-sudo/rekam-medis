<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praktek Mandiri dr. Galih | Daftar Online</title><style>body{margin:0;font-family:system-ui;background:#eef2f7}.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:12px 18px;display:flex;justify-content:space-between}.menu{background:#fff;margin:12px 16px 0;border-radius:14px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 10px #0001}.menu a{padding:8px 14px;border-radius:20px;background:#f1f5f9;text-decoration:none;color:#334155;font-size:13px}.menu a.active{background:#3b82f6;color:#fff}.card{background:#fff;margin:16px auto;border-radius:14px;padding:24px;box-shadow:0 2px 10px #0001;max-width:480px}input,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;box-sizing:border-box}button{width:100%;padding:14px;background:#10b981;color:white;border:none;border-radius:12px;font-weight:600;cursor:pointer;font-size:16px}</style></head><body>
<div class="header"><div>🏥 Praktek Mandiri dr. Galih | Daftar Online</div><div><a href="/antrian.html" style="color:white">Antrian</a> | <a href="/dashboard.html" style="color:white">Login Dokter</a></div></div>
<div class="card"><h2 style="margin-top:0">DAFTAR</h2><form id="f"><input name="nama" placeholder="Nama Lengkap" required><input name="hp" placeholder="No HP" required><input name="alamat" placeholder="Alamat"><textarea name="keluhan" placeholder="Keluhan" rows="3"></textarea><button type="submit">Daftar Sekarang</button></form><div id="msg" style="margin-top:12px;text-align:center"></div></div>
<script>f.onsubmit=async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());const btn=f.querySelector('button');btn.innerText='Mendaftar...';btn.disabled=true;try{const r=await fetch('/api/daftar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(r.ok){msg.innerHTML=`<b style="color:green">✅ Berhasil Daftar!</b><br>No Antrian: <b>#${j.no_antrian||1}</b><br>No RM: ${j.no_rm||''}<br><small>Silakan tunggu panggilan di Antrian</small>`;f.reset()}else msg.innerHTML='<b style=color:red>❌ '+(j.error||'Gagal')+'</b>'}catch(e){msg.innerText='Gagal koneksi'}btn.innerText='Daftar Sekarang';btn.disabled=false}</script></body></html>
