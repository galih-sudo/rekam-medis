<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Online - Praktek dr Galih</title>
<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
.header{background:linear-gradient(90deg,#3b82f6,#1e40af);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.header a{color:#fff;text-decoration:none;font-weight:600;margin-left:12px}
.wrap{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0001}
h2{margin:0 0 16px}
.marquee{width:100%;background:#f0f9ff;border-radius:8px;overflow:hidden;white-space:nowrap;margin:0 0 14px;padding:8px 0;border:1px solid #e0f2fe}
.marquee span{display:inline-block;padding-left:100%;animation:marquee 18s linear infinite;color:#0369a1;font-size:12.5px;font-weight:600}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
input,textarea{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid #e2e8f0;margin:7px 0;font-size:14px;outline:none}
input:focus,textarea:focus{border-color:#14b8a6;box-shadow:0 0 0 3px #14b8a633}
.btn{width:100%;padding:14px;background:#14b8a6;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer}
.btn:hover{background:#0d9488}
.copy{margin-top:16px;font-size:11px;color:#94a3b8;text-align:center;border-top:1px solid #f1f5f9;padding-top:12px}
</style>
</head><body>
<div class="header"><div>🏥 Praktek Mandiri dr. Galih | Daftar Online</div><div><a href="/antrian.html">Antrian</a><a href="/login.html">Login Dokter</a></div></div>
<div class="wrap">
<div class="card">
<h2>DAFTAR</h2>
<div class="marquee"><span>🏥 Praktek Mandiri dr.Galih | 📍 Jl.Raya Sengkol Aikdarek | 😊 Melayani dengan senyum | 🕕 Buka setiap hari kerja jam 06.00-11.00 dan 17.00-21.00 WITA |</span></div>
<input id="nama" placeholder="Nama Lengkap">
<input id="hp" placeholder="No HP">
<input id="alamat" placeholder="Alamat">
<textarea id="keluhan" rows="3" placeholder="Keluhan"></textarea>
<button class="btn" onclick="daftar()">Daftar Sekarang</button>
<div id="msg" style="margin-top:10px;font-size:13px;text-align:center"></div>
<div class="copy">Copyright - Vercel.Postgres + AI @2026</div>
</div>
</div>
<script>
async function daftar(){
  let data={nama:document.getElementById('nama').value, no_hp:document.getElementById('hp').value, alamat:document.getElementById('alamat').value, keluhan:document.getElementById('keluhan').value};
  if(!data.nama){document.getElementById('msg').innerText='Isi nama dulu bro!';return;}
  try{
    const r=await fetch('/api/daftar-online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const d=await r.json();
    if(r.ok){document.getElementById('msg').style.color='#059669';document.getElementById('msg').innerText='Berhasil daftar! No Antrian: '+(d.no_antrian||''); setTimeout(()=>location.href='/antrian.html',1500);}
    else{document.getElementById('msg').style.color='#ef4444';document.getElementById('msg').innerText=d.message||'Gagal daftar';}
  }catch(e){document.getElementById('msg').innerText='Error: '+e}
}
</script>
</body></html>
