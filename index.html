<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekam Medis - Praktek Mandiri V5.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<script>
const SUPABASE_URL = 'https://biltcndrqmxflrzqgicn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6hR-sHiQzTItSl9WKjW6PA_TeyQaka8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null; let activePasienId = null;
(async()=>{ const {data}=await sb.auth.getSession(); if(data.session) loadUserAndShowApp(data.session.user); })();
async function loginGitHub(){ const {error}=await sb.auth.signInWithOAuth({provider:'github', options:{redirectTo: window.location.href}}); if(error) alert(error.message); }
async function loginEmail(){ const email=document.getElementById('emailInput').value.trim(); const password=document.getElementById('passInput').value; if(!email||!password) return alert('Isi email & password dulu bro'); const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error) alert(error.message); else loadUserAndShowApp(data.user); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function loadUserAndShowApp(authUser){
  let {data:user}=await sb.from('users').select('*').eq('auth_id', authUser.id).single();
  if(!user){ const {data:newUser}=await sb.from('users').insert({auth_id:authUser.id, nama:authUser.email.split('@')[0], role:'perawat'}).select().single(); user=newUser; }
  currentUser=user;
  document.getElementById('userName').textContent=user.nama;
  const lp=document.getElementById('loginPage');
  lp.classList.add('hidden');
  lp.style.display='none';
  const ap=document.getElementById('appPage');
  ap.classList.remove('hidden');
  ap.style.display='block';
  applyRole(); loadPasien();
}
function applyRole(){
  const isDokter=currentUser.role==='dokter';
  const badge=document.getElementById('roleBadge');
  const adminBtn=document.getElementById('adminBtn');
  badge.textContent=isDokter?'🩺 DOKTER':'💉 PERAWAT';
  badge.className=isDokter?'bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold':'bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-bold';
  if(isDokter){ adminBtn.classList.remove('hidden'); document.querySelectorAll('.dokter-only').forEach(el=>el.classList.remove('hidden')); }
  else{ adminBtn.classList.add('hidden'); document.querySelectorAll('.dokter-only').forEach(el=>el.classList.add('hidden')); }
}
async function loadPasien(){
  const q=document.getElementById('searchPasien')?.value||'';
  let query=sb.from('pasien').select('*').order('created_at',{ascending:false}).limit(50);
  if(q) query=query.ilike('nama','%'+q+'%');
  const {data}=await query;
  const tb=document.getElementById('pasienBody');
  if(!data||!data.length){tb.innerHTML='<tr><td colspan=3 class="p-6 text-center text-slate-400">Belum ada pasien</td></tr>';return;}
  tb.innerHTML=data.map(p=>`<tr onclick="bukaDetail('${p.id}')" class="border-b hover:bg-blue-50 cursor-pointer"><td class="p-3 font-medium text-blue-700">${p.nama} →</td><td class="p-3">${p.no_rm||'-'}</td><td class="p-3 text-slate-500">${p.alamat||'-'}</td></tr>`).join('');
}
async function tambahPasien(){ const nama=prompt('Nama pasien:'); if(!nama) return; const no_rm=prompt('No RM:'); const alamat=prompt('Alamat:'); const {error}=await sb.from('pasien').insert({nama,no_rm,alamat,created_by:currentUser.id}); if(error) alert(error.message); else loadPasien(); }
async function bukaDetail(id){ activePasienId=id; document.getElementById('detailModal').classList.remove('hidden'); document.getElementById('detailModal').classList.add('flex'); const {data:p}=await sb.from('pasien').select('*').eq('id',id).single(); document.getElementById('dNama').textContent=p.nama; document.getElementById('dRM').textContent=p.no_rm; document.getElementById('dAlamat').textContent=p.alamat; loadKunjungan(id); }
function tutupDetail(){ document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); }
async function loadKunjungan(pasien_id){ const {data}=await sb.from('kunjungan').select('*').eq('pasien_id',pasien_id).order('tanggal',{ascending:false}); const list=document.getElementById('kunjunganList'); if(!data||!data.length){list.innerHTML='<div class="text-center text-slate-400 text-sm py-6">Belum ada kunjungan</div>';return;} list.innerHTML=data.map(k=>`<div class="bg-white border p-4 rounded-2xl"><div class="flex justify-between text-[11px] text-slate-500 mb-1"><span>${k.tanggal}</span></div><div class="text-sm"><b>Keluhan:</b> ${k.keluhan||'-'}</div><div class="text-sm"><b>Diagnosa:</b> ${k.diagnosa||'-'}</div><div class="text-sm bg-yellow-50 p-2 rounded-lg mt-2"><b>Resep:</b> ${k.resep||'-'}</div><div class="flex gap-2 mt-3 dokter-only"><button onclick="cetakResep('${k.id}')" class="flex-1 bg-slate-900 text-white text-xs py-2 rounded-lg font-bold">🖨️ Resep</button><button onclick="cetakSurat('${k.id}')" class="flex-1 bg-blue-600 text-white text-xs py-2 rounded-lg font-bold">📄 Surat</button></div></div>`).join(''); }
async function tambahKunjungan(){ const keluhan=document.getElementById('kKeluhan').value; const diagnosa=document.getElementById('kDiagnosa').value; const resep=document.getElementById('kResep').value; if(!keluhan) return alert('Isi keluhan dulu'); const {error}=await sb.from('kunjungan').insert({pasien_id:activePasienId, keluhan, diagnosa, resep, tanggal:new Date().toISOString().split('T')[0]}); if(error) alert(error.message); else{ document.getElementById('kKeluhan').value=''; document.getElementById('kDiagnosa').value=''; document.getElementById('kResep').value=''; loadKunjungan(activePasienId); } }
async function cetakResep(id){ const {data:k}=await sb.from('kunjungan').select('*, pasien(nama,no_rm)').eq('id',id).single(); const w=window.open('','_blank'); w.document.write(`<html><body style="font-family:Arial;padding:30px"><h2>Praktek Mandiri - Resep</h2><p>Nama: ${k.pasien.nama} | No RM: ${k.pasien.no_rm}</p><div style="border:1px solid #000;padding:15px">R/<br>${(k.resep||'').replace(/\n/g,'<br>')}</div><p style="text-align:right">(${currentUser.nama})</p><script>window.print()<\/script></body></html>`); }
async function cetakSurat(id){ const {data:k}=await sb.from('kunjungan').select('*, pasien(nama,alamat)').eq('id',id).single(); const w=window.open('','_blank'); w.document.write(`<html><body style="font-family:Arial;padding:40px"><h2 style="text-align:center">SURAT SAKIT</h2><p>Nama: ${k.pasien.nama}</p><p>Diagnosa: ${k.diagnosa}</p><p style="text-align:right">Mataram, ${new Date().toLocaleDateString('id-ID')}<br>(${currentUser.nama})</p><script>window.print()<\/script></body></html>`); }
async function bukaAdmin(){ document.getElementById('adminModal').classList.remove('hidden'); document.getElementById('adminModal').classList.add('flex'); loadAdminUsers(); }
function tutupAdmin(){ document.getElementById('adminModal').classList.add('hidden'); document.getElementById('adminModal').classList.remove('flex'); }
async function loadAdminUsers(){ const {data:users}=await sb.from('users').select('*').order('created_at',{ascending:true}); const list=document.getElementById('adminUserList'); if(!users) return; list.innerHTML=users.map(u=>`<div class="flex items-center justify-between border p-3 rounded-xl ${u.role==='dokter'?'bg-blue-50':'bg-emerald-50'}"><div><div class="font-bold text-sm">${u.nama}</div><div class="text-[11px] text-slate-500">${u.role}</div></div><select onchange="gantiRole('${u.id}', this.value)" class="text-xs border rounded-lg px-2 py-2 font-bold"><option value="dokter" ${u.role==='dokter'?'selected':''}>Dokter</option><option value="perawat" ${u.role==='perawat'?'selected':''}>Perawat</option></select></div>`).join('')+`<div class="text-center text-xs text-slate-400 mt-4">${users.length}/6 Tim</div>`; }
async function gantiRole(userId, newRole){ const {error}=await sb.from('users').update({role:newRole}).eq('id', userId); if(error) alert(error.message); else { loadAdminUsers(); if(userId===currentUser.id){currentUser.role=newRole; applyRole();} } }
</script>
<div id="loginPage" class="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-50" style="display:flex"><div class="bg-white p-8 rounded-[24px] shadow-xl w-full max-w-sm"><div class="text-center"><div class="text-5xl mb-3">🩺</div><h1 class="text-2xl font-bold">Praktek Mandiri</h1><p class="text-sm text-slate-500 mb-6">V5.1 - Fix Login</p></div><div class="space-y-3"><input id="emailInput" type="email" placeholder="Email" class="w-full border p-3 rounded-xl text-sm"><input id="passInput" type="password" placeholder="Password" class="w-full border p-3 rounded-xl text-sm"><button onclick="loginEmail()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Login Email</button></div><div class="text-center my-4 text-xs text-slate-400">atau</div><button onclick="loginGitHub()" class="w-full bg-black text-white py-3 rounded-xl font-bold text-sm">Login GitHub (dr. Galih)</button></div></div>
<div id="appPage" class="hidden" style="display:none"><div class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-10"><div class="flex items-center gap-2"><div class="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold">R</div><div><div class="font-bold text-sm">Rekam Medis</div><div id="userName" class="text-xs text-slate-500"></div></div><span id="roleBadge"></span></div><div class="flex gap-2"><button id="adminBtn" onclick="bukaAdmin()" class="hidden bg-purple-600 text-white text-xs px-3 py-2 rounded-xl font-bold">👥 Tim</button><button onclick="logout()" class="text-xs bg-slate-100 px-3 py-2 rounded-xl">Logout</button></div></div><div class="p-4 max-w-4xl mx-auto"><div class="flex gap-2 mb-4"><input id="searchPasien" oninput="loadPasien()" placeholder="Cari pasien..." class="flex-1 border p-3 rounded-xl text-sm"><button onclick="tambahPasien()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold">+ Pasien</button></div><div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500 text-left"><tr><th class="p-3">Nama</th><th class="p-3">No RM</th><th class="p-3">Alamat</th></tr></thead><tbody id="pasienBody"></tbody></table></div></div></div>
<div id="detailModal" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center p-4"><div class="bg-white w-full max-w-lg rounded-[24px] shadow-2xl max-h-[90vh] flex flex-col"><div class="p-6 border-b flex justify-between"><div><h3 id="dNama" class="text-xl font-bold"></h3><p class="text-sm text-slate-500"><span id="dRM"></span> • <span id="dAlamat"></span></p></div><button onclick="tutupDetail()" class="bg-slate-100 w-8 h-8 rounded-full">✕</button></div><div class="p-6 space-y-4 overflow-auto"><div class="bg-blue-50 p-4 rounded-2xl"><h4 class="font-bold text-sm mb-3">+ Kunjungan</h4><textarea id="kKeluhan" placeholder="Keluhan..." class="w-full border rounded-xl p-3 text-sm mb-2"></textarea><textarea id="kDiagnosa" placeholder="Diagnosa (dokter)..." class="w-full border rounded-xl p-3 text-sm mb-2 dokter-only"></textarea><textarea id="kResep" placeholder="Resep (dokter)..." class="w-full border rounded-xl p-3 text-sm mb-3 h-20 dokter-only"></textarea><button onclick="tambahKunjungan()" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm">Simpan</button></div><div id="kunjunganList" class="space-y-3"></div></div></div></div>
<div id="adminModal" class="hidden fixed inset-0 bg-black/60 z-[60] items-center justify-center p-4"><div class="bg-white w-full max-w-md rounded-[24px] shadow-2xl"><div class="p-6 border-b flex justify-between items-center"><h3 class="font-bold text-lg">👥 Kelola Tim</h3><button onclick="tutupAdmin()" class="bg-slate-100 w-8 h-8 rounded-full">✕</button></div><div class="p-6"><div id="adminUserList" class="space-y-3 max-h-[400px] overflow-auto"></div></div></div></div>
</body>
</html>
