<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - V8 Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-600 to-indigo-700 flex items-center justify-center p-4">
<div class="bg-white w-full max-w-[400px] rounded-[24px] p-8 shadow-2xl text-center">
<div class="text-5xl mb-2">🏥</div>
<h2 class="text-2xl font-bold text-violet-700">Dr. Galih Clinic</h2>
<p class="text-gray-500 text-sm mb-6">Praktik Medis Modern - V8 Premium</p>
<input id="user" class="w-full p-3 border rounded-xl mb-3" placeholder="Username">
<input id="pass" type="password" class="w-full p-3 border rounded-xl mb-3" placeholder="Password">
<button onclick="login()" class="w-full bg-violet-600 text-white p-3 rounded-xl font-bold hover:bg-violet-700">LOGIN</button>
<div class="mt-4 bg-gray-50 p-3 rounded-xl text-left text-[13px] leading-6">
<b class="text-violet-600">Akun:</b><br>
👨‍⚕️ dokter / dokter123<br>
👩‍⚕️ perawat / perawat123<br>
👑 admin / admin
</div>
</div>
<script>
const USERS=[{u:'admin',p:'admin',role:'Admin',nama:'Admin'},{u:'dokter',p:'dokter123',role:'Dokter',nama:'dr. Galih'},{u:'perawat',p:'perawat123',role:'Perawat',nama:'Perawat Jaga'}];
function login(){const u=user.value.trim(),p=pass.value.trim(),f=USERS.find(x=>x.u===u&&x.p===p);if(f){localStorage.setItem('login','ok');localStorage.setItem('role',f.role);localStorage.setItem('nama_user',f.nama);location.href='dashboard.html';}else alert('Salah!');}
</script>
</body>
</html>
