<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praktek Mandiri - V5.1 Fix Login</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f5f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:360px}
h2{text-align:center;margin:0 0 20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:12px;background:#111827;color:#fff;border:0;border-radius:8px;cursor:pointer;margin-top:12px;font-weight:600}
button:hover{background:#000}
.error{color:#dc2626;font-size:13px;margin-top:8px;display:none;text-align:center}
.info{background:#eef2ff;padding:10px;border-radius:8px;font-size:12px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>Praktek Mandiri<br><small style="font-size:12px;color:#666">V5.1 - Fix Login</small></h2>
<input id="email" placeholder="Email / Username" value="admin">
<input id="pass" type="password" placeholder="Password" value="admin123">
<button onclick="login()">LOGIN</button>
<div id="err" class="error">Invalid login credentials</div>
<div class="info">Email: <b>admin</b><br>Pass: <b>admin123</b></div>
<div style="margin-top:16px;text-align:center">
<button onclick="loginGH()" style="background:#24292f">Login GitHub (dr. Galih)</button>
</div>
</div>
<script>
function login(){
  const e=document.getElementById('email').value.trim().toLowerCase();
  const p=document.getElementById('pass').value.trim();
  console.log("TRY",e,p);
  if((e==="admin" || e==="admin@local" || e==="admin@admin.com") && p==="admin123"){
    localStorage.setItem("pm_user", JSON.stringify({email:"admin", role:"admin"}));
    location.href="dashboard.html";
  } else {
    document.getElementById('err').style.display="block";
    document.getElementById('err').innerText="Invalid login: "+e+" / "+p;
  }
}
function loginGH(){
  localStorage.setItem("pm_user", JSON.stringify({email:"galih@github", role:"admin"}));
  location.href="dashboard.html";
}
// Enter key
document.getElementById('pass').addEventListener('keyup', e=>{ if(e.key==="Enter") login(); });
</script>
</body>
</html>
