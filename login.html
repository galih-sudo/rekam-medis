<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - dr. Galih</title>
<style>body{font-family:system-ui; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.card{background:white; color:black; padding:30px; border-radius:20px; width:90%; max-width:350px; text-align:center}
input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #ccc; box-sizing:border-box}
.btn{width:100%; padding:12px; background:#0ea5e9; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer}
</style></head><body>
<div class="card">
<h2>🔒 Praktek dr. Galih</h2><p>Login Dokter</p>
<input id="user" placeholder="Username: drgalih">
<input id="pass" type="password" placeholder="Password: galih123">
<button class="btn" onclick="login()">MASUK</button>
<p id="msg" style="color:red"></p>
<small>user: drgalih / pass: galih123</small>
</div>
<script>
function login(){
  const u=document.getElementById('user').value
  const p=document.getElementById('pass').value
  if(u==='drgalih' && p==='galih123'){
    localStorage.setItem('login_drg','ok'); location.href='/dashboard.html'
  } else document.getElementById('msg').innerText='Salah!'
}
</script></body></html>
